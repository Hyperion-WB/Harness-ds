name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows .exe Installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.3.{0}', github.run_number) }}
          releaseName: DeepSeek Harness GUI ${{ github.ref_type == 'tag' && github.ref_name || format('v0.3.{0}', github.run_number) }}
          releaseBody: |
            ## DeepSeek Harness GUI for Windows (x64)

            ### 🚀 开箱即用
            - 下载下方 `..._x64-setup.exe` 安装包并直接运行安装；
            - 在「设置」中填入 API Key（或选择免 Key 的 Ollama 本地模型），选择任意工作区目录即可秒级开启 Agent 会话！

            ### ✨ 核心特性
            - **官方全功能引擎**：100% 完整呈现 DeepSeek-R1 深度思考链、代码 Diff 对比与工具执行；
            - **280+ 社区插件生态**：支持官方精选与社区插件雷达一键安装升级；
            - **多模型服务网关**：内置 DeepSeek 官方、硅基流动、Ollama、OpenRouter、Kimi 等统一凭证管理；
            - **超低资源占用**：原生 Tauri 2 架构，无多余后台进程残留。
          releaseDraft: false
          prerelease: false
